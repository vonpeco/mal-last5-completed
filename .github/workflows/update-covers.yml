name: Update MAL cover images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      poster_width:
        description: "Poster width in pixels"
        required: false
        type: string
        default: "79"
      poster_height:
        description: "Poster height in pixels"
        required: false
        type: string
        default: "118"
      background_color:
        description: "Poster background color (hex)"
        required: false
        type: string
        default: "#1D1D1D"
      border_color:
        description: "Poster border color (hex)"
        required: false
        type: string
        default: "#F5364F"
      border_width:
        description: "Poster border width in pixels"
        required: false
        type: string
        default: "1.5"
      border_radius:
        description: "Poster corner radius in pixels"
        required: false
        type: string
        default: "5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate cover images
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          POSTER_WIDTH: ${{ inputs.poster_width || '79' }}
          POSTER_HEIGHT: ${{ inputs.poster_height || '118' }}
          POSTER_BG_COLOR: ${{ inputs.background_color || '#1D1D1D' }}
          POSTER_BORDER_COLOR: ${{ inputs.border_color || '#F5364F' }}
          POSTER_BORDER_WIDTH: ${{ inputs.border_width || '1.5' }}
          POSTER_RADIUS: ${{ inputs.border_radius || '5' }}
        run: python generate.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
